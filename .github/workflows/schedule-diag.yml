# 诊断用：验证 GitHub 调度器是否向本仓库投递 schedule 事件（结论出来后删除）
name: Schedule Diagnostics

on:
  schedule:
    - cron: "*/15 * * * *"   # 每 15 分钟一次，只跑一句 echo，几秒结束

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: echo "schedule fired at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
